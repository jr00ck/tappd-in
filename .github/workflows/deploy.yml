name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish PWA shell + demo video (playable on Pages / README embeds).
      - name: Stage Pages artifact
        run: |
          mkdir -p _site/demo
          cp index.html style.css app.js sw.js manifest.webmanifest package.json _site/
          cp -R icons _site/icons
          # Demo page + MP4 for public playback (release assets force-download)
          if ls demo/*.mp4 >/dev/null 2>&1; then
            cp demo/*.mp4 _site/demo/
            [ -f demo/index.html ] && cp demo/index.html _site/demo/
          fi
          [ -f README.md ] && cp README.md _site/ || true
          [ -f CHANGELOG.md ] && cp CHANGELOG.md _site/ || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # PWA shell only — keep Pages storage lean (no demo videos).
      - name: Stage Pages artifact
        run: |
          mkdir -p _site
          cp index.html style.css app.js sw.js manifest.webmanifest package.json _site/
          cp -R icons _site/icons
          [ -f README.md ] && cp README.md _site/ || true
          [ -f CHANGELOG.md ] && cp CHANGELOG.md _site/ || true
          # Tiny README GIF only (if present) — not hosted as a Pages video library
          if [ -f docs/demo.gif ]; then
            mkdir -p _site/docs
            cp docs/demo.gif _site/docs/
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
